name: Android preview
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 tests/check_java_syntax.py
      - run: python3 tests/check_schedule.py
      - run: gradle -p android --no-daemon assembleDebug lintDebug
      - run: gradle -p android signingReport
      - uses: actions/upload-artifact@v4
        with:
          name: hamrah-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
